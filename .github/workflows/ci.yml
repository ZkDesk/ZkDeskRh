name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Privacy check (mirror columns, logging, browser storage, secrets in the bundle)
        run: pnpm privacy

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - name: Solidity dependencies
        working-directory: contracts
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          forge install foundry-rs/forge-std@v1.16.2 --no-git
      - name: forge test (real UltraHonk proofs from circuits/fixtures)
        working-directory: contracts
        run: forge test

  noir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install nargo 1.0.0-beta.22 (circuits/VERSIONS)
        run: |
          # noirup installer pinned to noir-lang/noirup main @ 2026-09-17
          curl -sSfL https://raw.githubusercontent.com/noir-lang/noirup/bedac8fbe6a059177c35e565f9f76db54a795976/install | bash
          "$HOME/.nargo/bin/noirup" -v 1.0.0-beta.22
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
      - name: nargo check and test
        working-directory: circuits
        run: |
          nargo --version
          nargo check --workspace
          nargo test --workspace

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - name: Install slither
        run: pipx install slither-analyzer==0.11.6
      - name: Solidity dependencies
        working-directory: contracts
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          forge install foundry-rs/forge-std@v1.16.2 --no-git
      - name: Stub generated UltraHonk verifiers
        working-directory: contracts
        # Slither 0.11.6 crashes (constant folding) on the generated verifiers' nested file-level
        # constants. They are generated code and excluded from results anyway, so this CI-only
        # checkout replaces each with an interface-compatible stub before analysis.
        run: |
          for f in src/verifiers/*.sol; do
            name=$(basename "$f" .sol)
            printf '%s\n' '// SPDX-License-Identifier: Apache-2.0' 'pragma solidity >=0.8.21;' \
              'interface IVerifier { function verify(bytes calldata _proof, bytes32[] calldata _publicInputs) external view returns (bool); }' \
              "contract $name is IVerifier { function verify(bytes calldata, bytes32[] calldata) external pure returns (bool) { return false; } }" > "$f"
          done
      - name: slither (fails on high impact)
        working-directory: contracts
        run: slither . --config-file slither.config.json

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: >-
          semgrep scan --config p/javascript --config p/secrets --error --metrics=off
          --exclude dist --exclude node_modules --exclude contracts/lib --exclude contracts/node_modules

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: gitleaks (full history, .gitleaks.toml)
        run: '"$RUNNER_TEMP/gitleaks" detect --no-banner --redact -v'
