name: deployment-check

# Daily read-only check of the live mainnet deployment: governance, wiring, source verification and
# the deployed runtime code against this commit's build (scripts/check-deployment.mjs). Set the RPC_URL secret if the public RPC refuses CI runners.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mainnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - name: Build the contracts (the deployed runtime code is compared with this build)
        working-directory: contracts
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          forge install foundry-rs/forge-std@v1.16.2 --no-git
          forge build
      - name: check-deployment (mainnet)
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: node scripts/check-deployment.mjs mainnet
