name: deployment-check

# Daily read-only check of the live mainnet deployment: governance, wiring and source verification
# (scripts/check-deployment.mjs). Set the RPC_URL secret if the public RPC refuses CI runners.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mainnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: check-deployment (mainnet)
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: node scripts/check-deployment.mjs mainnet
