[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "../circuits/fixtures" }, { access = "read-write", path = "../src/lib/chain/deployments" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "poseidon-solidity/=node_modules/poseidon-solidity/",
]

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
